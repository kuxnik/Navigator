name: Грунтовки МО в GPX

on:
  workflow_dispatch:
  push:
    paths:
      - tool/osm_mo_tracks.py
      - .github/workflows/osm-mo-tracks.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Скачать выгрузку OSM (Центральный ФО)
        run: |
          for url in \
            https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf \
            https://download.openstreetmap.fr/extracts/russia/central_federal_district-latest.osm.pbf \
            http://download.openstreetmap.fr/extracts/russia/central_federal_district-latest.osm.pbf; do
            echo "Пробую $url"
            if curl -4 -fsSL --retry 3 --connect-timeout 30 -o cfd.osm.pbf "$url"; then break; fi
            rm -f cfd.osm.pbf
          done
          ls -la cfd.osm.pbf

      - name: Вырезать МО и грунтовки
        run: |
          osmium extract -b 35.10,54.20,40.30,57.00 cfd.osm.pbf -o mo.osm.pbf
          osmium tags-filter mo.osm.pbf w/highway=track w/4wd_only=yes -o tracks.osm.pbf
          osmium export tracks.osm.pbf -f geojsonseq --geometry-types=linestring -o tracks.geojsonseq
          wc -l tracks.geojsonseq

      - name: Нарезать на GPX
        run: python3 tool/osm_mo_tracks.py tracks.geojsonseq mo_tracks

      - name: Список файлов
        run: cat mo_tracks/СПИСОК.txt

      - name: Релиз с GPX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: osm-mo-tracks
          name: Грунтовки Московской области (GPX для Компас 55)
          make_latest: false
          body: |
            Лесные и полевые дороги (highway=track) из OpenStreetMap по Московской области и Москве, по проходимости.
            Нарезаны квадратами примерно 45×40 км, крупные поделены на части. Каждый файл не больше 6 МБ.

            **mo_tracks.zip** — все файлы одним архивом и СПИСОК.txt с размерами и числом дорог.
            Отдельные GPX ниже — можно скачать только нужные квадраты.
            Имя файла — юго-западный угол: например, mo_55.00N_37.05E.gpx — от 55.00° с. ш., 37.05° в. д.

            В каждом файле до 4 треков: любая машина / кроссовер / джип / класс не указан.

            Данные © участники OpenStreetMap, лицензия ODbL. Обновлено: ${{ github.run_id }}.
          files: |
            mo_tracks.zip
            mo_tracks/*.gpx
            mo_tracks/СПИСОК.txt
