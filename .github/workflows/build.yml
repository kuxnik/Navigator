name: Сборка APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Версия Flutter
        run: flutter --version

      - name: Создать Android-часть проекта
        run: |
          flutter create --platforms=android --org ru.kuxnik --project-name navigator .
          rm -f test/widget_test.dart

      - name: Разрешения и версии Gradle
        run: python3 tool/patch_android.py

      - name: Зависимости
        run: flutter pub get

      - name: Проверка кода
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Тесты
        run: flutter test

      - name: Сборка APK
        run: flutter build apk --release

      - name: Переименовать APK
        run: cp build/app/outputs/flutter-apk/app-release.apk navigator-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: navigator-apk
          path: navigator-${{ github.run_number }}.apk
          retention-days: 30
