name: Сборка APK и IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Версия Flutter
        run: flutter --version

      - name: Создать Android-часть проекта
        run: |
          flutter create --platforms=android --org ru.kuxnik --project-name navigator .
          rm -f test/widget_test.dart

      - name: Разрешения, подпись, версии Gradle
        env:
          NAV_KEYSTORE_PASSWORD: ${{ secrets.NAV_KEYSTORE_PASSWORD }}
        run: python3 tool/patch_android.py

      - name: Зависимости
        run: |
          flutter pub get
          # flutter_inappwebview_android ссылается на устаревший proguard-файл, новый AGP его не принимает
          for f in $HOME/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle; do
            [ -f "$f" ] && sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" "$f" && echo "patched $f"
          done

      - name: Проверка кода
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Тесты
        run: flutter test

      - name: Сборка APK
        env:
          NAV_KEYSTORE_PASSWORD: ${{ secrets.NAV_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Переименовать APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk navigator-${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk navigator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: navigator-apk
          path: navigator.apk
          retention-days: 30

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Создать iOS-часть проекта
        run: |
          flutter create --platforms=ios --org ru.kuxnik --project-name navigator .
          rm -f test/widget_test.dart
          python3 tool/patch_ios.py

      - name: Зависимости
        run: flutter pub get

      - name: Сборка под iPhone (без подписи)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Упаковать IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry navigator.ipa Payload
          ls -la navigator.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: navigator-ipa
          path: navigator.ipa
          retention-days: 30

  release:
    needs: [android, ios]
    if: always() && github.event_name != 'pull_request' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Навигатор — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            Ветка `${{ github.ref_name }}`, коммит ${{ github.sha }}.

            **Android:** скачать **navigator.apk** → открыть на телефоне → установить.
            **iPhone:** скачать **navigator.ipa** на компьютер → установить через Sideloadly со своим Apple ID (см. README).
          files: |
            out/navigator.apk
            out/navigator.ipa
