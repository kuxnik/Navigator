name: navigator
description: Офлайн-навигатор для машины — карты mbtiles, точки, треки, курс по гироскопу с поправкой по GPS.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  geolocator: '>=13.0.0 <16.0.0'
  sensors_plus: '>=6.0.0 <8.0.0'
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  file_picker: '>=8.0.0 <11.0.0'
  share_plus: '>=11.0.0 <14.0.0'
  xml: ^6.5.0
  http: ^1.2.0
  wakelock_plus: '>=1.2.8 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
